<!doctype html>
<html lang="zh-CN">

    <link rel="stylesheet" href="./styles.css" />

  <body data-page="profile">
    <main class="app-shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Stage 01</p>
          <h1>职业画像</h1>
          <p class="subtitle">AI 职业咨询师先把简历、项目、技能和兴趣转成可解释的能力画像。</p>
        </div>
        <div class="hero-metrics" aria-label="profile summary">
          <div><strong id="topScore">92%</strong><span>当前最佳匹配</span></div>
          <div><strong>4</strong><span>能力维度</span></div>
          <div><strong>3类</strong><span>不推荐方向</span></div>
        </div>
      </section>

      <section class="result-panel page-panel">
        <nav class="stage-tabs" aria-label="analysis pages">
          <a class="tab" href="./index.html">重新分析</a>
          <a class="tab active" href="./profile.html">职业画像</a>
          <a class="tab" href="./jobs.html">岗位匹配</a>
          <a class="tab" href="./resume.html">简历优化</a>

        <section class="tab-page active" id="profile">
          <div class="section-head">
            <p class="eyebrow">Stage 01</p>
            <h2>AI 职业咨询师画像</h2>
          </div>
          <div class="score-grid" id="abilityGrid"></div>
          <div class="two-column">
            <article class="insight-card">

              <ul id="fitList"></ul>
            </article>
            <article class="insight-card muted">

    <script src="./app.js"></script>
