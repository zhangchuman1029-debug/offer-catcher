<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offer 捕手 | 开始分析</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="start">
    <main class="app-shell">
      <section class="hero start-hero">
        <div>
          <p class="eyebrow">AI Career Agent Demo</p>
          <h1>Offer 捕手</h1>
          <p class="subtitle">上传求职信息后，AI 将依次完成职业画像、岗位匹配、简历优化和成长路线规划。</p>
        </div>
        <div class="hero-metrics" aria-label="demo summary">
          <div><strong>4步</strong><span>智能分析流程</span></div>
          <div><strong>3秒</strong><span>Demo 分析耗时</span></div>
          <div><strong>1份</strong><span>完整求职报告</span></div>
        </div>
      </section>

      <section class="input-home">
        <div class="panel-title">
          <span>填写学生求职信息</span>
          <button id="loadSample" type="button">载入示例</button>
        </div>

        <section class="upload-zone" id="uploadZone" aria-label="resume upload area">
          <div>
            <p class="eyebrow">Resume Upload</p>
            <h2>拖拽简历文件到这里</h2>
            <p>支持 PDF、Word 文档和图片。也可以选择单个文件，或打开文件夹批量导入。</p>
          </div>
          <div class="upload-actions">
            <button class="ghost-action" id="pickFilesBtn" type="button">选择文件</button>
            <button class="ghost-action" id="pickFolderBtn" type="button">打开文件夹</button>
          </div>
          <input id="resumeFiles" type="file" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.webp,.txt" multiple hidden />
          <input id="resumeFolder" type="file" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.webp,.txt" webkitdirectory multiple hidden />
        </section>

        <div class="file-results" id="fileResults" aria-live="polite"></div>

        <div class="input-grid">
          <label>
            简历 / 自我介绍
            <textarea id="resumeInput" rows="9"></textarea>
          </label>

          <label>
            项目经历
            <textarea id="projectInput" rows="9"></textarea>
          </label>

          <label>
            技能关键词
            <input id="skillInput" type="text" />
          </label>

          <label>
            兴趣方向
            <input id="interestInput" type="text" />
          </label>
        </div>

        <button class="primary-action start-action" id="analyzeBtn" type="button">开始求职分析</button>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
