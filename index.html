<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offer 捕手 | 职业画像</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="profile">
    <main class="app-shell">
      <section class="hero">
        <div>
          <p class="eyebrow">AI Career Agent Demo</p>
          <h1>Offer 捕手</h1>
          <p class="subtitle">从职业画像、岗位匹配、简历优化到成长路线图，一次完成学生求职决策。</p>
        </div>
        <div class="hero-metrics" aria-label="demo summary">
          <div><strong id="topScore">92%</strong><span>当前最佳匹配</span></div>
          <div><strong>4</strong><span>能力维度</span></div>
          <div><strong>7天</strong><span>行动计划</span></div>
        </div>
      </section>

      <section class="workspace">
        <aside class="input-panel" aria-label="student profile input">
          <div class="panel-title">
            <span>学生输入</span>
            <button id="loadSample" type="button">载入示例</button>
          </div>

          <label>
            简历 / 自我介绍
            <textarea id="resumeInput" rows="9"></textarea>
          </label>

          <label>
            项目经历
            <textarea id="projectInput" rows="7"></textarea>
          </label>

          <label>
            技能关键词
            <input id="skillInput" type="text" />
          </label>

          <label>
            兴趣方向
            <input id="interestInput" type="text" />
          </label>

          <button class="primary-action" id="analyzeBtn" type="button">更新求职分析</button>
        </aside>

        <section class="result-panel">
          <nav class="stage-tabs" aria-label="analysis pages">
            <a class="tab active" href="./index.html">职业画像</a>
            <a class="tab" href="./jobs.html">岗位匹配</a>
            <a class="tab" href="./resume.html">简历优化</a>
            <a class="tab" href="./roadmap.html">成长路线</a>
          </nav>

          <section class="tab-page active" id="profile">
            <div class="section-head">
              <p class="eyebrow">Stage 01</p>
              <h2>AI 职业咨询师画像</h2>
            </div>
            <div class="score-grid" id="abilityGrid"></div>
            <div class="two-column">
              <article class="insight-card">
                <h3>适合方向</h3>
                <ul id="fitList"></ul>
              </article>
              <article class="insight-card muted">
                <h3>不推荐方向</h3>
                <ul id="avoidList"></ul>
              </article>
            </div>
          </section>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
